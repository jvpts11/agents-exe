[polaron_project]

[program]
name = "AgentsExe"
version = "0.1.0"
language_version = "1.0"
entry = "src/main.pol"

# The OpenGL binding is installed by the toolchain (`polaron plug`), which writes the dependency below.
# Nothing here names opengl32, gdi32, user32, kernel32 or gdiplus: each foreign class in Polaron-OpenGL
# names the library it comes from, and that library's manifest maps the name to a file per platform, so
# the mapping travels inside its .polb.

[build]
output = "build-output/"
target = "x86_64-windows"
freestanding = false
subsystem = "windows"

[dependencies]
Polaron-OpenGL = { path = "libraries/Polaron-OpenGL", source = "https://github.com/jvpts11/Polaron-OpenGL@^1.0.0" }
